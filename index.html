<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d9488">
<title>旅行记账 · Trip Ledger</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="manifest" id="pwaManifest">
<script>
  // 单文件 PWA：通过 data URI 注入 manifest，支持“添加到主屏幕”
  var _m = {name:"旅行记账",short_name:"旅行记账",start_url:".",display:"standalone",background_color:"#f0fdfa",theme_color:"#0d9488",icons:[{src:"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192"><rect width="192" height="192" rx="40" fill="#0d9488"/><text x="96" y="122" font-size="88" text-anchor="middle">🌴</text></svg>'),sizes:"192x192",type:"image/svg+xml"}]};
  document.getElementById('pwaManifest').href = 'data:application/manifest+json,'+encodeURIComponent(JSON.stringify(_m));
</script>
<style>
  html{-webkit-tap-highlight-color:transparent}
  body{font-family:ui-rounded,-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#f0fdfa}
  .card{background:#fff;border-radius:1.25rem;box-shadow:0 2px 12px rgba(13,148,136,.08);border:1px solid #ccfbf1}
  .chip{display:inline-flex;align-items:center;gap:.3rem;padding:.35rem .8rem;border-radius:9999px;font-size:.8rem;background:#fff;border:1.5px solid #99f6e4;color:#0f766e;white-space:nowrap;cursor:pointer}
  .chip.on{background:#0d9488;color:#fff;border-color:#0d9488;font-weight:600}
  .inp{width:100%;padding:.7rem .9rem;border-radius:.9rem;border:1.5px solid #99f6e4;background:#fff;font-size:.95rem;outline:none}
  .inp:focus{border-color:#0d9488;box-shadow:0 0 0 3px rgba(13,148,136,.15)}
  .btn-p{width:100%;padding:.85rem;border-radius:1rem;background:linear-gradient(135deg,#0d9488,#10b981);color:#fff;font-weight:700;font-size:1rem;box-shadow:0 4px 14px rgba(13,148,136,.35)}
  .btn-g{padding:.5rem .9rem;border-radius:.8rem;background:#f0fdfa;border:1.5px solid #99f6e4;color:#0f766e;font-size:.85rem;font-weight:600}
  .tabbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.5rem 0 .6rem;font-size:.68rem;color:#5eead4;font-weight:600}
  .tabbtn.on{color:#0d9488}
  .tabbtn .ic{font-size:1.35rem;line-height:1}
  .hidebar::-webkit-scrollbar{display:none}.hidebar{scrollbar-width:none}
  .num{font-variant-numeric:tabular-nums}
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .pop{animation:pop .18s ease-out}
</style>
<base target="_blank">
</head>
<body>
<div class="max-w-md mx-auto min-h-screen relative pb-24">

<!-- ══════════ 登录 / 注册 ══════════ -->
<div id="vAuth" class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full card p-8 pop">
    <div class="text-center mb-6">
      <div class="text-5xl mb-2">🌴</div>
      <h1 class="text-2xl font-extrabold text-teal-800">旅行记账</h1>
      <p class="text-sm text-teal-600 mt-1">多币种 · 智能清账 · 多人协同</p>
    </div>
    <p id="authSub" class="text-xs text-teal-700 bg-teal-50 border border-teal-200 rounded-xl p-3 mb-4 text-center"></p>
    <label class="text-xs font-bold text-teal-700">旅伴姓名 / 昵称</label>
    <input id="aName" class="inp mt-1 mb-3" placeholder="例如：小明" maxlength="12">
    <label class="text-xs font-bold text-teal-700">数字密码 (1-6 位 PIN)</label>
    <input id="aPin" class="inp mt-1 mb-1" placeholder="•••" inputmode="numeric" maxlength="6" type="password" autocomplete="off">
    <p id="authMsg" class="text-xs text-red-500 h-4 mb-2"></p>
    <button id="aBtn" class="btn-p">进入</button>
    <p class="text-[11px] text-teal-500 text-center mt-4">数据保存在本设备 LocalStorage，可配置 Supabase 多端云同步</p>
  </div>
</div>

<!-- ══════════ 主应用 ══════════ -->
<div id="vApp" class="hidden">
  <header class="sticky top-0 z-30 bg-teal-600 text-white px-4 pt-3 pb-3 shadow-md">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xl">🌴</span>
        <span class="font-extrabold text-lg">旅行记账</span>
        <span id="cloudDot" class="inline-block w-2.5 h-2.5 rounded-full bg-slate-300" title="本地模式"></span>
      </div>
      <button id="hUser" class="flex items-center gap-1.5 bg-teal-700/60 rounded-full pl-1 pr-3 py-1 text-sm font-semibold"></button>
    </div>
    <div id="tripChips" class="flex gap-2 mt-3 overflow-x-auto hidebar"></div>
  </header>

  <main class="p-4">
    <section id="tab-ledger"></section>
    <section id="tab-add" class="hidden"></section>
    <section id="tab-settle" class="hidden"></section>
    <section id="tab-stats" class="hidden"></section>
    <section id="tab-me" class="hidden"></section>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 z-30 bg-white border-t border-teal-100 flex max-w-md mx-auto" style="padding-bottom:env(safe-area-inset-bottom)">
    <button class="tabbtn on" data-tab="ledger"><span class="ic">📒</span>账本</button>
    <button class="tabbtn" data-tab="add"><span class="ic">➕</span>记一笔</button>
    <button class="tabbtn" data-tab="settle"><span class="ic">💸</span>清账</button>
    <button class="tabbtn" data-tab="stats"><span class="ic">📊</span>统计</button>
    <button class="tabbtn" data-tab="me"><span class="ic">👤</span>我的</button>
  </nav>
</div>

<!-- ══════════ 账目详情弹窗 ══════════ -->
<div id="modal" class="hidden fixed inset-0 z-40 bg-black/50 flex items-end sm:items-center justify-center" onclick="if(event.target===this)closeModal()">
  <div id="modalCard" class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 pop max-h-[85vh] overflow-y-auto"></div>
</div>

<!-- ══════════ 发票大图 ══════════ -->
<div id="lightbox" class="hidden fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4" onclick="this.classList.add('hidden');this.classList.remove('flex')">
  <img id="lbImg" class="max-w-full max-h-full rounded-xl">
</div>

<div id="toast" class="hidden fixed left-1/2 -translate-x-1/2 bottom-24 z-50 bg-teal-800 text-white text-sm font-semibold px-5 py-2.5 rounded-full shadow-xl"></div>
</div>

<script>
/* ═══════════════════════ 常量与状态 ═══════════════════════ */
var $ = function(id){return document.getElementById(id)};
var esc = function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var fmt = function(n){return 'S$ '+(Math.round((Number(n)||0)*100)/100).toFixed(2)};
var uid = function(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)};
var todayStr = function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
var LS_KEY='jt_state_v1';

var CATS=[['breakfast','早餐','🍳'],['lunch','午餐','🍱'],['dinner','晚餐','🍽️'],['stay','住宿','🏨'],['transport','交通','🚇'],['ticket','门票景点','🎫'],['visa','签证/保险','🛡️'],['shopping','购物','🛍️'],['sim','通信/WiFi','📶'],['fun','其他娱乐','🎡']];
function catName(id){var c=CATS.find(function(x){return x[0]===id});return c?c[1]:id}
function catIcon(id){var c=CATS.find(function(x){return x[0]===id});return c?c[2]:'💰'}
var AVATARS=['🦊','🐼','🐯','🦁','🐸','🐙','🦋','🐳','🌵','🌊','🏔️','🎈','🍉','⭐'];
var FLAGS=['🇸🇬','🇯🇵','🇨🇳','🇹🇭','🇲🇾','🇮🇩','🇻🇳','🇰🇷','🇪🇺','🇺🇸','🇬🇧','🇦🇺','🇳🇿','🏳️'];

function blankState(code){
  return {v:1, room:{code:code||String(Math.floor(100000+Math.random()*900000))},
    members:[], trips:[], expenses:[],
    currencies:[{code:'SGD',name:'新加坡元',symbol:'S$',rate:1}],
    supabase:{url:'',key:''}, meta:{updatedAt:0,rev:0}};
}

var S=null, ME=null, curTripId=null, tab='ledger';
var editingExp=null, editingTrip=null, editingCur=null, editingMem=null;
var receiptData=null, selCat='dinner', pendingReceipt=null;
var filters={cat:'all',who:'all'};
var pushTimer=null, cloudOk=false, cloudMsg='';

function load(){ try{var r=localStorage.getItem(LS_KEY); if(r){S=JSON.parse(r);return}}catch(e){} S=blankState() }
function save(){
  S.meta.rev=(S.meta.rev||0)+1;
  S.meta.updatedAt=Date.now();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch(e){ toast('⚠️ 存储空间不足，请删除部分发票图片'); }
  schedulePush(); updateCloudDot();
}
function b64(buf){ var s=''; new Uint8Array(buf).forEach(function(x){s+=String.fromCharCode(x)}); return btoa(s) }
function _unb64(s){ return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)}) }
var _key=null;
async function roomKey(){
  if(_key) return _key;
  var hbuf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('jt-lock-v1:'+S.room.code));
  _key=await crypto.subtle.importKey('raw',hbuf,{name:'AES-GCM'},false,['encrypt','decrypt']);
  return _key;
}
async function encPack(obj){
  try{
    if(!(crypto&&crypto.subtle)) return JSON.stringify(obj);
    var k=await roomKey(), iv=crypto.getRandomValues(new Uint8Array(12));
    var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(JSON.stringify(obj)));
    return 'enc1:'+b64(iv)+':'+b64(ct);
  }catch(e){ return JSON.stringify(obj) }
}
async function decPack(s){
  if(typeof s!=='string'||s.indexOf('enc1:')!==0) return (typeof s==='string')?JSON.parse(s):s;
  var p=s.split(':'); var k=await roomKey();
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:_unb64(p[1])},k,_unb64(p[2]));
  return JSON.parse(new TextDecoder().decode(pt));
}
function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.remove('hidden'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.add('hidden')},1800) }

/* ═══════════════════════ 云端同步 (Supabase) ═══════════════════════ */
function sbCfg(){ return S.supabase||{url:'',key:''} }
function sbHeaders(){ return {'apikey':sbCfg().key,'Authorization':'Bearer '+sbCfg().key,'Content-Type':'application/json'} }
function updateCloudDot(){
  var d=$('cloudDot'); if(!d) return;
  d.className='inline-block w-2.5 h-2.5 rounded-full ';
  var cfg=sbCfg();
  if(!cfg.url||!cfg.key){ d.className+='bg-slate-300'; d.title='本地模式（未配置云端）'; }
  else if(cloudMsg){ d.className+='bg-red-400'; d.title='同步错误：'+cloudMsg; }
  else if(!cloudOk){ d.className+='bg-amber-400 animate-pulse'; d.title='同步中…'; }
  else { d.className+='bg-emerald-300'; d.title='云端已同步 · 房间 '+S.room.code; }
}
function schedulePush(){ clearTimeout(pushTimer); pushTimer=setTimeout(pushNow,900) }
async function pushNow(){
  var cfg=sbCfg(); cloudMsg='';
  if(!cfg.url||!cfg.key){cloudOk=false;updateCloudDot();return}
  updateCloudDot();
  try{
    var row={room_code:S.room.code, data:await encPack(S), updated_at:new Date().toISOString()};
    var r=await fetch(cfg.url.replace(/\/$/,'')+'/rest/v1/journey_sync',{
      method:'POST', headers:Object.assign(sbHeaders(),{'Prefer':'return=minimal,resolution=merge-duplicates,on_conflict=room_code'}),
      body:JSON.stringify(row)});
    if(!r.ok) throw new Error(r.status+' '+await r.text());
    cloudOk=true; cloudMsg='';
  }catch(e){ cloudOk=false; cloudMsg=(e&&e.message)||'网络错误' }
  updateCloudDot();
}
async function pullNow(){
  var cfg=sbCfg(); if(!cfg.url||!cfg.key) return;
  try{
    var r=await fetch(cfg.url.replace(/\/$/,'')+'/rest/v1/journey_sync?room_code=eq.'+encodeURIComponent(S.room.code)+'&select=data,updated_at',{headers:sbHeaders()});
    if(!r.ok) throw new Error(r.status+'');
    var rows=await r.json();
    cloudOk=true; cloudMsg='';
    if(rows&&rows.length){
      var rd=await decPack(rows[0].data);
      var rr=rd&&rd.meta?(rd.meta.rev||0):0, lr=S.meta.rev||0;
      if(rr>lr){
        S=rd; try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}
        if(ME) ME=S.members.find(function(m){return m.id===ME.id})||null;
        if(!ME){ location.reload(); return }
        ensureCurTrip(); renderAll();
      } else if(rr<lr){ schedulePush() }
    }
  }catch(e){ cloudOk=false; cloudMsg=(e&&e.message)||'网络错误' }
  updateCloudDot();
}
setInterval(pullNow,15000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden) pullNow() });

/* ═══════════════════════ 登录 / 注册 ═══════════════════════ */
function showAuth(){
  $('vAuth').classList.remove('hidden'); $('vApp').classList.add('hidden');
  var isFirst=S.members.length===0;
  $('authSub').textContent = isFirst ? '👑 欢迎！本机尚无成员，首位注册者将自动成为超级管理员' : '输入旅伴姓名与 PIN 码登录';
  $('aBtn').textContent = isFirst ? '创建超管账号并进入' : '登 录';
  $('authMsg').textContent='';
  $('aName').value=''; $('aPin').value='';
}
$('aBtn').onclick=function(){
  var name=$('aName').value.trim(), pin=$('aPin').value.trim();
  if(!name){$('authMsg').textContent='请输入姓名';return}
  if(!/^\d{1,6}$/.test(pin)){$('authMsg').textContent='PIN 码须为 1-6 位数字';return}
  if(S.members.length===0){
    ME={id:uid(),name:name,pin:pin,avatar:AVATARS[0],phone:'',tripIds:[],isAdmin:true};
    S.members.push(ME); save();
    sessionStorage.setItem('jt_me',ME.id);
    enterApp(); toast('👑 超管账号已创建');
  }else{
    var m=S.members.find(function(x){return x.name===name&&x.pin===pin});
    if(!m){$('authMsg').textContent='姓名或密码不正确';return}
    ME=m; sessionStorage.setItem('jt_me',ME.id); enterApp();
  }
};
$('aPin').addEventListener('keydown',function(e){ if(e.key==='Enter') $('aBtn').click() });

/* ═══════════════════════ 入口与导航 ═══════════════════════ */
function canSeeTrip(t){ return ME.isAdmin || ME.tripIds.indexOf(t.id)>=0 }
function visibleTrips(){ return S.trips.filter(canSeeTrip) }
function tripMembers(tid){ return S.members.filter(function(m){return m.isAdmin||m.tripIds.indexOf(tid)>=0}) }
function memName(id){ var m=S.members.find(function(x){return x.id===id}); return m?m.name:'(已删除)' }
function memAvatar(id){ var m=S.members.find(function(x){return x.id===id}); return m?m.avatar:'👤' }

function ensureCurTrip(){
  var vs=visibleTrips();
  if(!vs.some(function(t){return t.id===curTripId})) curTripId = vs.length?vs[0].id:null;
}
function enterApp(){
  $('vAuth').classList.add('hidden'); $('vApp').classList.remove('hidden');
  var saved=sessionStorage.getItem('jt_trip');
  if(saved&&visibleTrips().some(function(t){return t.id===saved})) curTripId=saved;
  ensureCurTrip(); renderAll(); pullNow();
  if(pendingReceipt){ var e=S.expenses.find(function(x){return x.id===pendingReceipt}); if(e){openExpense(e.id)} pendingReceipt=null }
}
function switchTab(t){
  tab=t;
  document.querySelectorAll('.tabbtn').forEach(function(b){b.classList.toggle('on',b.dataset.tab===t)});
  ['ledger','add','settle','stats','me'].forEach(function(k){$('tab-'+k).classList.toggle('hidden',k!==t)});
  if(t==='add'&&!editingExp) resetAddForm();
  renderAll(true); window.scrollTo(0,0);
}
document.querySelectorAll('.tabbtn').forEach(function(b){ b.onclick=function(){switchTab(b.dataset.tab)} });
$('hUser').onclick=function(){switchTab('me')};

var lastRev=-1, formDirty=false;
document.addEventListener('input',function(e){ if(e.target&&e.target.closest&&e.target.closest('#tab-add')) formDirty=true });
function renderAll(force){
  if(!ME) return;
  var _r=S.meta.rev||0;
  if(!force&&_r===lastRev) return;
  lastRev=_r;
  $('hUser').innerHTML='<span class="text-lg">'+ME.avatar+'</span>'+esc(ME.name)+(ME.isAdmin?' <span class="text-amber-300">👑</span>':'');
  renderTripChips();
  if(tab==='ledger') renderLedger();
  else if(tab==='add'){ if(!formDirty) renderAdd(); }
  else if(tab==='settle') renderSettle();
  else if(tab==='stats') renderStats();
  else renderMe();
}
function renderTripChips(){
  var vs=visibleTrips(), h='';
  vs.forEach(function(t){
    h+='<button class="chip '+(t.id===curTripId?'on':'')+'" onclick="pickTrip(\''+t.id+'\')">'+t.flag+' '+esc(t.name)+'</button>';
  });
  if(ME.isAdmin) h+='<button class="chip" onclick="switchTab(\'me\');admSub(\'trips\')">＋ 管理行程</button>';
  $('tripChips').innerHTML=h;
}
function pickTrip(id){ curTripId=id; sessionStorage.setItem('jt_trip',id); filters={cat:'all',who:'all'}; renderAll(true) }
</script>
<script>
/* ═══════════════════════ 账本明细 ═══════════════════════ */
function curTrip(){ return S.trips.find(function(t){return t.id===curTripId}) }
function tripExpenses(){ return S.expenses.filter(function(e){return e.tripId===curTripId}) }

function renderLedger(){
  var el=$('tab-ledger'), t=curTrip();
  if(!t){ el.innerHTML='<div class="card p-10 text-center text-teal-600"><div class="text-4xl mb-2">🗺️</div>'+(ME.isAdmin?'还没有行程，请到「我的 → 行程管理」创建':'等待超管为你分配行程')+'</div>'; return }
  var exps=tripExpenses();
  var total=exps.reduce(function(a,e){return a+e.sgd},0);
  var days=1, d1=new Date(t.start), d2=new Date(t.end);
  if(!isNaN(d1)&&!isNaN(d2)) days=Math.max(1,Math.round((d2-d1)/86400000)+1);
  var ms=tripMembers(t.id), perDay=ms.length? total/ms.length/days : 0;

  var h='<div class="card p-4 mb-3 bg-gradient-to-br from-teal-600 to-emerald-500 !border-0 text-white">'
    +'<div class="flex justify-between items-start"><div><p class="text-xs opacity-80">当前行程总支出（折合 SGD）</p>'
    +'<p class="text-3xl font-extrabold num mt-1">'+fmt(total)+'</p></div>'
    +(ME.isAdmin?'<button class="btn-g !bg-white/20 !border-white/30 !text-white text-xs" onclick="exportCSV()">⬇️ CSV 报表</button>':'')+'</div>'
    +'<div class="grid grid-cols-3 gap-2 mt-3 text-center text-xs">'
    +'<div class="bg-white/15 rounded-xl py-2"><p class="opacity-75">人均日花费</p><p class="font-bold num text-sm">'+fmt(perDay)+'</p></div>'
    +'<div class="bg-white/15 rounded-xl py-2"><p class="opacity-75">记账笔数</p><p class="font-bold text-sm">'+exps.length+' 笔</p></div>'
    +'<div class="bg-white/15 rounded-xl py-2"><p class="opacity-75">行程天数</p><p class="font-bold text-sm">'+days+' 天</p></div>'
    +'</div></div>';

  h+='<div class="flex gap-2 mb-3 overflow-x-auto hidebar">'
    +'<select class="inp !w-auto !py-1.5 text-sm" onchange="filters.cat=this.value;renderLedger()">'
    +'<option value="all">全部分类</option>'+CATS.map(function(c){return '<option value="'+c[0]+'"'+(filters.cat===c[0]?' selected':'')+'>'+c[2]+' '+c[1]+'</option>'}).join('')+'</select>'
    +'<select class="inp !w-auto !py-1.5 text-sm" onchange="filters.who=this.value;renderLedger()">'
    +'<option value="all">全部垫付人</option>'+ms.map(function(m){return '<option value="'+m.id+'"'+(filters.who===m.id?' selected':'')+'>'+m.avatar+' '+esc(m.name)+'</option>'}).join('')+'</select></div>';

  var list=exps.filter(function(e){
    if(filters.cat!=='all'&&e.cat!==filters.cat) return false;
    if(filters.who!=='all'&&e.paidBy!==filters.who) return false;
    return true;
  }).sort(function(a,b){return (b.date+b.ts).localeCompare(a.date+a.ts)});

  if(!list.length){ h+='<div class="card p-10 text-center text-teal-500"><div class="text-4xl mb-2">🧾</div>暂无记录，点击底部「记一笔」开始</div>' }
  else{
    h+='<div class="card divide-y divide-teal-50">';
    list.forEach(function(e){
      h+='<button class="w-full text-left p-3.5 flex items-center gap-3 active:bg-teal-50" onclick="openExpense(\''+e.id+'\')">'
        +'<span class="text-2xl w-10 h-10 flex items-center justify-center bg-teal-50 rounded-xl">'+catIcon(e.cat)+'</span>'
        +'<span class="flex-1 min-w-0"><span class="block font-bold text-slate-800 text-sm truncate">'+catName(e.cat)+(e.note?' · '+esc(e.note):'')+'</span>'

function calcSgd(){
  var a=parseFloat($('fAmt').value)||0, c=S.currencies.find(function(x){return x.code===$('fCur').value});
  if(!c||!$('fSgd')) return;
  $('fSgd').textContent='折合：'+fmt(a*c.rate)+'（汇率 1 '+c.code+' = '+c.rate+' SGD）';
}
function onReceipt(input){
  var f=input.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      var cv=document.createElement('canvas'), sc=Math.min(1,900/Math.max(img.width,img.height));
      cv.width=img.width*sc; cv.height=img.height*sc;
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      receiptData=cv.toDataURL('image/jpeg',0.72);
      $('fReceiptPrev').innerHTML='<div class="relative inline-block"><img src="'+receiptData+'" class="h-24 rounded-xl border border-teal-200" onclick="showLB(this.src)"><button onclick="receiptData=null;renderAdd()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 text-xs font-bold">✕</button></div>';
    };
    img.src=rd.result;
  };

}

<script>
/* ═══════════════════════ 智能清账 (Greedy Min-Cash-Flow) ═══════════════════════ */
function computeBalances(tid){
  var bal={};
  tripMembers(tid).forEach(function(m){bal[m.id]={paid:0,owe:0}});
  S.expenses.filter(function(e){return e.tripId===tid}).forEach(function(e){
    if(bal[e.paidBy]) bal[e.paidBy].paid+=e.sgd;
    e.split.forEach(function(mid){ if(bal[mid]) bal[mid].owe+=e.sgd/e.split.length });
  });
  return bal;
}
function settlePlan(bal){
  var arr=Object.keys(bal).map(function(k){return {id:k,net:Math.round((bal[k].paid-bal[k].owe)*100)/100}})
    .filter(function(x){return Math.abs(x.net)>0.005}).sort(function(a,b){return b.net-a.net});
  var plan=[],guard=0;
  while(arr.length>1&&guard++<100){
    var g=arr[0],l=arr[arr.length-1],pay=Math.round(Math.min(g.net,-l.net)*100)/100;
    if(pay<=0) break;
    plan.push({from:l.id,to:g.id,amt:pay});
    g.net=Math.round((g.net-pay)*100)/100; l.net=Math.round((l.net+pay)*100)/100;
    arr=arr.filter(function(x){return Math.abs(x.net)>0.005}).sort(function(a,b){return b.net-a.net});
  }
  return plan;
}
function renderSettle(){
  var el=$('tab-settle'), t=curTrip();
  if(!t){ el.innerHTML='<div class="card p-10 text-center text-teal-600">🗺️ 暂无行程</div>'; return }
  var bal=computeBalances(t.id), plan=settlePlan(bal), ms=tripMembers(t.id);
  var h='<h2 class="font-extrabold text-teal-800 text-lg mb-3">💸 智能清账 · '+t.flag+' '+esc(t.name)+'</h2>';
  h+='<div class="card p-4 mb-3"><p class="text-xs font-bold text-teal-700 mb-2">个人净余额</p><div class="space-y-2.5">';
  ms.forEach(function(m){
    var b=bal[m.id]||{paid:0,owe:0}, net=Math.round((b.paid-b.owe)*100)/100;
    h+='<div class="flex items-center gap-2 text-sm"><span>'+m.avatar+'</span><span class="font-semibold w-16 truncate">'+esc(m.name)+'</span>'
      +'<span class="flex-1 text-right text-xs text-slate-400 num">垫付 '+fmt(b.paid)+' / 应摊 '+fmt(b.owe)+'</span>'
      +'<span class="font-extrabold num w-24 text-right '+(net>0.005?'text-emerald-600':(net<-0.005?'text-red-500':'text-slate-400'))+'">'+(net>0.005?'+ ':'')+(Math.abs(net)<=0.005?'✓ 已结清':fmt(net))+'</span></div>';
  });
  h+='</div></div>';
  h+='<div class="card p-4 mb-3"><p class="text-xs font-bold text-teal-700 mb-2">最简转账方案（'+plan.length+' 笔）</p>';
  if(!plan.length) h+='<p class="text-sm text-teal-600 py-3 text-center">🎉 全员已平账，无需转账</p>';
  else plan.forEach(function(p){
    h+='<div class="flex items-center justify-between bg-teal-50 rounded-xl px-3 py-2.5 mb-2 text-sm">'
      +'<span>'+memAvatar(p.from)+' <b>'+esc(memName(p.from))+'</b> ➜ '+memAvatar(p.to)+' <b>'+esc(memName(p.to))+'</b></span>'
      +'<span class="font-extrabold text-teal-700 num">'+fmt(p.amt)+'</span></div>';
  });
  h+='</div>';
  if(plan.length) h+='<button class="btn-p !bg-none !bg-teal-700" onclick="copySettle()">📋 一键复制对账单</button>';
  el.innerHTML=h;
  el._plan=plan; el._trip=t.name;
}
function copySettle(){
  var plan=$('tab-settle')._plan, tn=$('tab-settle')._trip;
  var txt='【'+tn+' · 旅行对账单】\n';
  plan.forEach(function(p,i){ txt+=(i+1)+'. '+memName(p.from)+' → '+memName(p.to)+'：'+fmt(p.amt)+'\n' });
  txt+='（基准货币 SGD，请按以上转账后各自标记结清）';
  copyText(txt,'对账单已复制，可粘贴到微信/WhatsApp');
}
function copyText(txt,ok){
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){toast(ok)},function(){fallbackCopy(txt,ok)}) }
  else fallbackCopy(txt,ok);
}
function fallbackCopy(txt,ok){
  var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy');toast(ok)}catch(e){toast('复制失败，请手动复制')}
  document.body.removeChild(ta);
}

/* ═══════════════════════ 支出统计 ═══════════════════════ */
function renderStats(){
  var el=$('tab-stats'), t=curTrip();
  if(!t){ el.innerHTML='<div class="card p-10 text-center text-teal-600">🗺️ 暂无行程</div>'; return }
  var exps=tripExpenses(), total=exps.reduce(function(a,e){return a+e.sgd},0)||1;
  function bar(label,icon,val,color){
    var pct=Math.round(val/total*1000)/10;
    return '<div class="mb-3"><div class="flex justify-between text-sm mb-1"><span>'+icon+' '+esc(label)+'</span><span class="num font-bold">'+fmt(val)+' · '+pct+'%</span></div>'
     +'<div class="h-2.5 bg-teal-50 rounded-full overflow-hidden"><div class="h-full '+color+' rounded-full" style="width:'+Math.max(pct,1.5)+'%"></div></div></div>';
  }
  var colors=['bg-teal-500','bg-emerald-400','bg-cyan-500','bg-amber-400','bg-rose-400','bg-indigo-400','bg-lime-500','bg-orange-400','bg-sky-400','bg-pink-400'];
  var byCat={}; exps.forEach(function(e){byCat[e.cat]=(byCat[e.cat]||0)+e.sgd});
  var byWho={}; exps.forEach(function(e){byWho[e.paidBy]=(byWho[e.paidBy]||0)+e.sgd});
  var h='<h2 class="font-extrabold text-teal-800 text-lg mb-3">📊 支出统计 · '+t.flag+' '+esc(t.name)+'</h2>'
   +'<div class="card p-4 mb-3"><p class="text-xs font-bold text-teal-700 mb-3">分类占比（总支出 '+fmt(total)+'）</p>'
   + Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a]}).map(function(k,i){return bar(catName(k),catIcon(k),byCat[k],colors[i%10])}).join('')
   +'</div><div class="card p-4"><p class="text-xs font-bold text-teal-700 mb-3">垫付贡献</p>'
   + Object.keys(byWho).sort(function(a,b){return byWho[b]-byWho[a]}).map(function(k,i){return bar(memName(k),memAvatar(k),byWho[k],colors[i%10])}).join('')+'</div>';
  el.innerHTML=h;
}

/* ═══════════════════════ CSV 导出（含发票链接） ═══════════════════════ */
function exportCSV(){
  var rows=[['日期','行程','分类','记账人','垫付人','金额','币种','汇率','折合SGD','分摊人','备注','发票凭证链接']];
  var base=location.origin+location.pathname;
  S.expenses.forEach(function(e){
    var t=S.trips.find(function(x){return x.id===e.tripId});
    rows.push([e.date,t?t.name:'',catName(e.cat),memName(e.recordBy),memName(e.paidBy),e.amount,e.currency,e.rate,e.sgd.toFixed(2),
      e.split.map(memName).join(' / '),e.note||'', e.receipt?base+'?receipt='+e.id:'']);
  });
  var csv='\ufeff'+rows.map(function(r){return r.map(function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')}).join('\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='旅行对账报表_'+todayStr()+'.csv'; a.click(); toast('⬇️ CSV 已导出');
}

    S.trips.forEach(function(t){
      var n=S.expenses.filter(function(e){return e.tripId===t.id}).length;
      h+='<div class="flex items-center gap-2 bg-teal-50 rounded-xl px-3 py-2 mb-2 text-sm">'
       +'<span class="flex-1">'+t.flag+' <b>'+esc(t.name)+'</b> <span class="text-xs text-slate-400">'+t.start+'~'+t.end+' · '+n+'笔</span></span>'
       +'<button class="btn-g !py-1 !px-2" onclick="editTripBtn(\''+t.id+'\')">✏️</button>'
       +'<button class="btn-g !py-1 !px-2 !text-red-500 !border-red-200 !bg-red-50" onclick="delTripBtn(\''+t.id+'\')">✕</button></div>';
    });
    var t2=editingTrip?S.trips.find(function(x){return x.id===editingTrip}):null;
    h+='<p class="text-sm font-bold text-slate-700 mt-4 mb-2">'+(t2?'编辑行程':'新增行程')+'</p>'
     +'<input id="tName" class="inp mb-2" placeholder="行程名称，如：日本关西 5 日游" value="'+(t2?esc(t2.name):'')+'">'
     +'<div class="flex gap-2 mb-2"><input id="tStart" type="date" class="inp" value="'+(t2?t2.start:todayStr())+'"><input id="tEnd" type="date" class="inp" value="'+(t2?t2.end:todayStr())+'"></div>'
     +'<div class="flex gap-2 mb-2 overflow-x-auto hidebar">'+FLAGS.map(function(f){return '<button class="chip '+(t2?(t2.flag===f?'on':''):(f==='🇸🇬'?'on':''))+'" onclick="this.parentNode.querySelectorAll(\'.chip\').forEach(function(c){c.classList.remove(\'on\')});this.classList.add(\'on\')">'+f+'</button>'}).join('')+'</div>'
     +'<p class="text-xs text-teal-700 mb-1">参与旅伴</p><div id="tMems" class="flex flex-wrap gap-2 mb-3">'
     + S.members.map(function(m){ var on=!t2||((t2.memberIds||[]).indexOf(m.id)>=0);
          return '<button type="button" class="chip '+(on?'on':'')+'" data-mid="'+m.id+'" onclick="this.classList.toggle(\'on\')">'+m.avatar+' '+esc(m.name)+'</button>'}).join('')+'</div>';
    h+='<button class="btn-p" onclick="saveTrip()">'+(t2?'保存行程':'＋ 创建行程')+'</button>';
  }
  else if(admTab==='curs'){
    h='<p class="text-sm font-bold text-slate-700 mb-2">货币与对 SGD 汇率</p>';
    S.currencies.forEach(function(c){
      h+='<div class="flex items-center gap-2 bg-teal-50 rounded-xl px-3 py-2 mb-2 text-sm num">'
       +'<b class="w-14">'+c.code+'</b><span class="flex-1 text-slate-500">'+esc(c.name)+' · 1 '+c.code+' = '+c.rate+' SGD</span>'
       +(c.code!=='SGD'?'<button class="btn-g !py-1 !px-2" onclick="editCurBtn(\''+c.code+'\')">✏️</button><button class="btn-g !py-1 !px-2 !text-red-500 !border-red-200 !bg-red-50" onclick="delCurBtn(\''+c.code+'\')">✕</button>':'<span class="text-xs text-teal-600">基准</span>')+'</div>';
    });
    var c2=editingCur?S.currencies.find(function(x){return x.code===editingCur}):null;
    h+='<p class="text-sm font-bold text-slate-700 mt-4 mb-2">'+(c2?'编辑货币':'添加货币')+'</p>'
     +'<div class="flex gap-2 mb-2"><input id="cCode" class="inp" style="text-transform:uppercase" placeholder="代码如 JPY" maxlength="5" value="'+(c2?c2.code:'')+'"'+(c2?' disabled':'')+'>'
     +'<input id="cSym" class="inp !w-20" placeholder="符号" maxlength="3" value="'+(c2?esc(c2.symbol):'')+'"></div>'
     +'<input id="cRate" type="number" step="any" class="inp mb-2 num" placeholder="对 SGD 汇率，如 0.009" value="'+(c2?c2.rate:'')+'">'
     +'<input id="cName" class="inp mb-3" placeholder="名称，如 日元" value="'+(c2?esc(c2.name):'')+'">'
     +'<button class="btn-p" onclick="saveCur()">'+(c2?'保存货币':'＋ 添加货币')+'</button>';
  }
  else if(admTab==='mems'){
    h='<p class="text-sm font-bold text-slate-700 mb-2">旅伴人员</p>';
    S.members.forEach(function(m){
      var trips=S.trips.filter(function(t){return m.tripIds.indexOf(t.id)>=0}).map(function(t){return t.flag}).join(' ')||'—';
      h+='<div class="flex items-center gap-2 bg-teal-50 rounded-xl px-3 py-2 mb-2 text-sm">'
       +'<span class="flex-1">'+m.avatar+' <b>'+esc(m.name)+'</b>'+(m.isAdmin?' 👑':'')+' <span class="text-xs text-slate-400">'+(m.phone||'')+' · '+trips+'</span></span>'
       +'<button class="btn-g !py-1 !px-2" onclick="resetPinBtn(\''+m.id+'\')">🔑</button>'
       +'<button class="btn-g !py-1 !px-2" onclick="editMemBtn(\''+m.id+'\')">✏️</button>'
       +(m.isAdmin?'':'<button class="btn-g !py-1 !px-2 !text-red-500 !border-red-200 !bg-red-50" onclick="delMemBtn(\''+m.id+'\')">✕</button>')+'</div>';
    });
    var m2=editingMem?S.members.find(function(x){return x.id===editingMem}):null;
    h+='<p class="text-sm font-bold text-slate-700 mt-4 mb-2">'+(m2?'编辑旅伴':'登记新旅伴')+'</p>'
     +'<input id="mName" class="inp mb-2" placeholder="姓名 / 昵称" value="'+(m2?esc(m2.name):'')+'">'
     +'<input id="mPhone" class="inp mb-2" placeholder="电话（选填）" value="'+(m2?esc(m2.phone||''):'')+'">'
     +'<input id="mPin" class="inp mb-2 num" placeholder="PIN 码(1-6位数字)" inputmode="numeric" maxlength="6" value="'+(m2?m2.pin:'')+'">'
     +'<p class="text-xs text-teal-700 mb-1">分配行程</p><div class="flex flex-wrap gap-2 mb-3">'
     + S.trips.map(function(t){var on=m2? m2.tripIds.indexOf(t.id)>=0 : true;
        return '<button type="button" class="chip '+(on?'on':'')+'" data-tid="'+t.id+'" onclick="this.classList.toggle(\'on\')">'+t.flag+' '+esc(t.name)+'</button>'}).join('')+'</div>'
     +'<button class="btn-p" onclick="saveMem()">'+(m2?'保存旅伴':'＋ 登记旅伴')+'</button>';
  }
  else if(admTab==='cloud'){
    var cfg=sbCfg();
    h='<p class="text-sm font-bold text-slate-700 mb-2">☁️ Supabase 云端同步</p>'
     +'<input id="sbUrl" class="inp mb-2" placeholder="Project URL，如 https://xxx.supabase.co" value="'+esc(cfg.url||'')+'">'
     +'<input id="sbKey" type="password" class="inp mb-3" placeholder="Publishable / anon Key" value="'+esc(cfg.key||'')+'">'
     +'<button class="btn-p mb-3" onclick="saveSb()">保存配置并连接</button>'
     +'<div class="grid grid-cols-2 gap-2 mb-2">'
     +'<button class="btn-g !py-3" onclick="copySQL()">📋 复制建表 SQL</button>'
     +'<button class="btn-g !py-3" onclick="pullNow();toast(\'正在从云端拉取…\')">⬇️ 云端覆盖本地</button></div>'
     +'<button class="btn-g !py-3 w-full mb-3" onclick="pushNow();toast(\'正在推送到云端…\')">⬆️ 本地覆盖云端</button>'
     +'<div class="flex gap-2 items-center"><input id="roomCode" class="inp num" value="'+S.room.code+'">'
     +'<button class="btn-g !py-2.5 whitespace-nowrap" onclick="changeRoom()">切换/新建房间</button></div>'
     +'<p class="text-[11px] text-amber-600 bg-amber-50 rounded-lg p-2 mt-1">⚠️ 所有设备必须填写相同房间号（建议长一点，如 SG2026-JP-7KQ2）并保存配置；新设备首次使用点「云端覆盖本地」拉取数据。</p>'+'<p class="text-[11px] text-slate-400 mt-2">状态：'+(!cfg.url?'未配置，当前为纯本地模式':'已配置')+' · 多端输入同一房间号即可实时协同</p>';
  }
  b.innerHTML=h;
}
function saveTrip(){
  var name=$('tName').value.trim(); if(!name){toast('请输入行程名称');return}
  var flag=document.querySelector('#admBody .chip.on'); flag=flag?flag.textContent:'🏳️';
  var mids=[].slice.call(document.querySelectorAll('#tMems .chip.on')).map(function(x){return x.dataset.mid});
  if(editingTrip){
    var t=S.trips.find(function(x){return x.id===editingTrip});
    t.name=name;t.start=$('tStart').value;t.end=$('tEnd').value;t.flag=flag;t.memberIds=mids;
  }else{
    S.trips.push({id:uid(),name:name,start:$('tStart').value,end:$('tEnd').value,flag:flag,memberIds:mids});
  }
  // 同步 member.tripIds 双向一致
  S.members.forEach(function(m){ m.tripIds=S.trips.filter(function(t){return t.memberIds.indexOf(m.id)>=0}).map(function(t){return t.id}) });
  editingTrip=null; save(); renderAll(); toast('✅ 行程已保存');
}
function editTripBtn(id){ editingTrip=id; renderMe() }
function delTripBtn(id){
  if(!confirm('删除该行程及其全部账目？'))return;
  S.trips=S.trips.filter(function(t){return t.id!==id});
  S.expenses=S.expenses.filter(function(e){return e.tripId!==id});
  S.members.forEach(function(m){m.tripIds=m.tripIds.filter(function(x){return x!==id})});
  save(); ensureCurTrip(); renderAll(); toast('已删除');
}
function saveCur(){
  var code=$('cCode').value.trim().toUpperCase(), rate=parseFloat($('cRate').value), sym=$('cSym').value.trim()||code, name=$('cName').value.trim()||code;
  if(editingCur){
    var c=S.currencies.find(function(x){return x.code===editingCur});
    c.rate=rate;c.symbol=sym;c.name=name; editingCur=null;
  }else{
    if(!/^[A-Z]{2,5}$/.test(code)){toast('币种代码须为 2-5 位字母');return}
    if(!(rate>0)){toast('请输入有效汇率');return}
    if(S.currencies.some(function(x){return x.code===code})){toast('该币种已存在');return}
    S.currencies.push({code:code,name:name,symbol:sym,rate:rate});
  }
  save(); renderMe(); toast('✅ 货币已保存');
}
function editCurBtn(c){ editingCur=c; renderMe() }
function delCurBtn(c){
  if(!confirm('删除币种 '+c+'？'))return;
  S.currencies=S.currencies.filter(function(x){return x.code!==c}); save(); renderMe(); toast('已删除');
}
function saveMem(){
  var name=$('mName').value.trim(), pin=$('mPin').value.trim();
  if(!name){toast('请输入姓名');return}
  if(!/^\d{1,6}$/.test(pin)){toast('PIN 须为 1-6 位数字');return}
  var tids=[].slice.call(document.querySelectorAll('#admBody .chip.on')).map(function(x){return x.dataset.tid}).filter(Boolean);
  if(editingMem){
    var m=S.members.find(function(x){return x.id===editingMem});
    m.name=name;m.phone=$('mPhone').value.trim();m.pin=pin;m.tripIds=tids;
    if(m.id===ME.id) ME=m;
    editingMem=null;
  }else{
    if(S.members.some(function(x){return x.name===name})){toast('该姓名已存在');return}
    S.members.push({id:uid(),name:name,pin:pin,avatar:AVATARS[S.members.length%AVATARS.length],phone:$('mPhone').value.trim(),tripIds:tids,isAdmin:false});
  }
  S.trips.forEach(function(t){ t.memberIds=S.members.filter(function(m){return m.tripIds.indexOf(t.id)>=0}).map(function(m){return m.id}) });
  save(); renderAll(); toast('✅ 旅伴已保存');
}
function editMemBtn(id){ editingMem=id; renderMe() }
function delMemBtn(id){
  if(S.expenses.some(function(e){return e.paidBy===id||e.split.indexOf(id)>=0||e.recordBy===id})){toast('⚠️ 该旅伴存在关联账目，无法删除');return}
  if(!confirm('删除该旅伴？'))return;
  S.members=S.members.filter(function(m){return m.id!==id});
  S.trips.forEach(function(t){t.memberIds=t.memberIds.filter(function(x){return x!==id})});
  save(); renderMe(); toast('已删除');
}
function resetPinBtn(id){
  var p=prompt('为 '+memName(id)+' 设置新 PIN（1-6 位数字）：');
  if(p==null)return;
  if(!/^\d{1,6}$/.test(p)){toast('PIN 须为 1-6 位数字');return}
  S.members.find(function(m){return m.id===id}).pin=p; save(); toast('🔑 密码已重置');
}
function saveSb(){
  S.supabase={url:$('sbUrl').value.trim(),key:$('sbKey').value.trim()};
  save(); cloudOk=false; updateCloudDot(); pushNow(); toast('☁️ 配置已保存，正在连接…');
}
function copySQL(){
  copyText([
    'create table if not exists public.journey_sync (',
    '  room_code text primary key,',
    '  data jsonb not null,',
    '  updated_at timestamptz not null default now()',
    ');',
    'alter table public.journey_sync enable row level security;',
    'drop policy if exists "Allow public access for ALL" on public.journey_sync;',
    'create policy "journey_select" on public.journey_sync for select using (true);',
    'create policy "journey_insert" on public.journey_sync for insert with check (true);',
    'create policy "journey_update" on public.journey_sync for update using (true) with check (true);',
    'drop table if exists public.trip_rooms; -- 清理非本应用残留表'
  ].join('\n'),"建表 SQL 已复制，请到 Supabase SQL Editor 执行");
}
async function changeRoom(){
  var code=$('roomCode').value.trim(); if(!code){toast('请输入房间号');return}
  if(!confirm('切换到房间 '+code+'？若云端已有数据将拉取覆盖本地，否则以当前数据新建。'))return;
  S.room.code=code; _key=null;
  await pullNow();
  if(cloudOk){ toast('☁️ 已切换到房间 '+code) } else { toast('🏠 已新建房间 '+code); save() }
  renderAll();
}

/* ═══════════════════════ 启动 ═══════════════════════ */
(function boot(){
  load();
  pendingReceipt=new URLSearchParams(location.search).get('receipt');
  var sid=sessionStorage.getItem('jt_me');
  ME=sid?S.members.find(function(m){return m.id===sid}):null;
  updateCloudDot();
  if(ME) enterApp(); else showAuth();
})();
</script>
